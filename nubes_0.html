<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		font-family: 'IBM Plex Mono', 'Courier New', monospace;
	}

	#potree_render_area {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
	}

	/* ---------- Panel flotante: foto sobre la nube ---------- */
	:root{
		--bg-panel: rgba(10,18,15,0.92);
		--line: #21352c;
		--phosphor: #63f2a0;
		--phosphor-dim: #3a6b52;
		--ink: #d7ecdf;
		--ink-dim: #7fa392;
		--danger: #f2705f;
	}

	#photoPanel{
		position: absolute;
		top: 16px;
		right: 16px;
		width: 260px;
		background: var(--bg-panel);
		border: 1px solid var(--line);
		color: var(--ink);
		font-size: 12px;
		z-index: 10000;
		backdrop-filter: blur(4px);
	}
	#photoPanel .head{
		display:flex; justify-content:space-between; align-items:center;
		padding: 8px 10px;
		border-bottom: 1px solid var(--line);
		font-size: 11px; letter-spacing:0.06em; text-transform:uppercase;
		color: var(--phosphor);
		cursor:pointer;
		user-select:none;
	}
	#photoPanel .body{ padding: 10px; }
	#photoPanel.collapsed .body{ display:none; }

	#dropzone{
		border: 1px dashed var(--phosphor-dim);
		padding: 16px 10px;
		text-align:center;
		cursor:pointer;
		font-size: 11px;
		color: var(--ink-dim);
		transition: border-color .15s, background .15s;
	}
	#dropzone.drag{ border-color: var(--phosphor); background: rgba(99,242,160,0.06); color: var(--ink); }
	#fileInput{ display:none; }

	.miniDrop{
		border: 1px dashed var(--phosphor-dim);
		padding: 10px 8px;
		text-align:center;
		cursor:pointer;
		font-size: 10px;
		color: var(--ink-dim);
		margin-bottom: 8px;
		transition: border-color .15s, background .15s;
	}
	.miniDrop.drag{ border-color: var(--phosphor); background: rgba(99,242,160,0.06); color: var(--ink); }
	.miniDrop.loaded{ border-style: solid; color: var(--phosphor); }
	#xmlFileInput{ display:none; }
	#xmlStatus{ font-size: 10px; color: var(--ink-dim); margin: -4px 0 8px; text-align:center; }

	#readout{ margin-top:10px; display:none; }
	#readout .row{
		display:flex; justify-content:space-between; gap:8px;
		padding: 3px 0; border-bottom: 1px solid var(--line);
	}
	#readout .row span:first-child{ color: var(--ink-dim); }
	#readout .row span:last-child{ text-align:right; }
	#readout .row.warn span:last-child{ color: var(--danger); }

	#opacityRow{ display:none; margin-top: 10px; }
	#opacityRow label{ display:block; color: var(--ink-dim); font-size: 10px; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:4px; }
	#opacityRow input[type=range]{ width: 100%; accent-color: var(--phosphor); }

	#removeBtn{
		display:none; margin-top: 10px; width:100%;
		background: transparent; border: 1px solid var(--danger); color: var(--danger);
		padding: 6px; cursor:pointer; font-family:inherit; font-size: 11px;
		letter-spacing: 0.05em; text-transform: uppercase;
	}
	#removeBtn:hover{ background: rgba(242,112,95,0.08); }

<div id="potree_render_area"></div>

<div id="photoPanel">
	<div class="head" id="photoPanelHead">Foto sobre la nube <span id="collapseIcon">▾</span></div>
	<div class="body">
		<div id="xmlDropzone" class="miniDrop">Cargar cámaras ajustadas<br>(XML exportado de Metashape)</div>

		<div id="opacityRow">
			<label>Opacidad de la foto</label>

		</div>

		<div id="viewBtnsRow" style="display:none; gap:6px; margin-top:10px;">
			<button id="flyBtn" class="ghostBtn">Ver como la cámara</button>
			<button id="restoreBtn" class="ghostBtn">Vista general</button>
		</div>

		<button id="removeBtn">Quitar foto</button>
		<div id="photoError"></div>
	</div>
</div>

<script>
	window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

	// Forzamos OrbitControls: EarthControls (el default) bloquea el giro
	// horizontal en nubes pequeñas / no georreferenciadas.
	viewer.setControls(viewer.orbitControls);

	viewer.setEDLEnabled(true);
	viewer.setFOV(60);
	viewer.setPointBudget(2_000_000);
	viewer.setBackground("gradient");

	// -------------------------------------------------------------------
	// Roll de cámara "manual".
	// Potree.View (viewer.scene.view) solo maneja yaw/pitch: el "up" queda
	// siempre fijo en Z mundo, así que no hay roll nativo. La cámara que
	// usa Potree (viewer.scene.camera) es sin embargo un THREE.PerspectiveCamera
	// normal dentro de la misma escena Three.js que la nube y la foto.
	// Cada frame, DESPUÉS de que Potree recalcula posición/yaw/pitch pero
	// ANTES de renderizar, dispara el evento "update": ahí le aplicamos
	// una rotación extra alrededor de su propio eje de visión (roll).
	// -------------------------------------------------------------------
	let cameraRollRad = 0;
	let rollTarget = null; // punto que mira la cámara mientras el roll está activo
	viewer.addEventListener('update', () => {
		if (!cameraRollRad || !rollTarget) return;
		const camera = (viewer.scene.getActiveCamera)
			? viewer.scene.getActiveCamera()
			: viewer.scene.camera;
		if (!camera) return;
		// Reconstruimos la orientación desde una base "sin roll" cada frame
		// (no una rotación relativa) para que el roll no se vaya acumulando
		// frame a frame.
		camera.up.set(0, 0, 1);
		camera.lookAt(rollTarget);
		camera.rotateZ(cameraRollRad);
	});

	// El enganche de roll de arriba corre en TODOS los frames y pisa lo que
	// haga OrbitControls, así que si lo dejamos activo el usuario no puede
	// orbitar (cada drag se resetea al frame siguiente). Apenas el usuario
	// toca el mouse/touch para navegar, lo soltamos: ya cumplió su propósito
	// (mostrar el roll correcto al entrar a la vista de la cámara) y a partir
	// de ahí el control pasa a ser 100% del OrbitControls normal.
	const renderArea = document.getElementById('potree_render_area');
	['mousedown','wheel','touchstart'].forEach(evt => {
		renderArea.addEventListener(evt, () => {
			cameraRollRad = 0;
			rollTarget = null;
		}, { passive: true });
	});

const POTREE_LFS_URL =
    "https://media.githubusercontent.com/media/EDGARZR54/CandelaDigital/main/js/potree/nubes/15m_utm14n_converted/octree.bin";

const originalFetch = window.fetch;

// -------------------------------------------------------------------
// Redirección de octree.bin a Git LFS.
//
// IMPORTANTE sobre CORS: no podemos reenviar el objeto `options` del
// fetch original tal cual. El loader de Potree arma esa petición
// pensando que va a un endpoint same-origin (tu propio GitHub Pages),
// y a veces incluye headers como "Content-Type" por costumbre de la
// librería. Contra media.githubusercontent.com eso dispara un preflight
// (OPTIONS) que ese host rechaza, porque su Access-Control-Allow-Headers
// no incluye "content-type" (solo suele permitir cosas como "range").
// Por eso reconstruimos las opciones desde cero y sólo dejamos pasar
// el header "Range", que es el que realmente se necesita para leer
// los distintos nodos del octree binario.
// -------------------------------------------------------------------
window.fetch = function(url, options) {
    if (typeof url === "string" && url.endsWith("/octree.bin")) {
        const newOptions = { method: (options && options.method) || "GET" };

        if (options && options.signal) newOptions.signal = options.signal;

        if (options && options.headers) {
            const h = new Headers(options.headers);
            if (h.has("range")) {
                newOptions.headers = { Range: h.get("range") };
            }
        }

        console.log("Redirigiendo octree.bin a Git LFS:", POTREE_LFS_URL, newOptions);
        return originalFetch(POTREE_LFS_URL, newOptions);
    }

    return originalFetch(url, options);
};


	Potree.loadPointCloud("js/potree/nubes/15m_utm14n_converted/metadata.json", "15m", function (e) {
		viewer.scene.addPointCloud(e.pointcloud);

		let material = e.pointcloud.material;
		material.size = 1;
		material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

		viewer.fitToScreen();
	});

	// =========================================================================
	// Proyección automática de fotos de dron sobre la nube de puntos.
	//
	// Supuestos (fijos, coinciden con el pipeline usado para generar esta nube:
	// reproyectar_utm.py con pyproj EPSG:4326 -> EPSG:32614, altura Z sin tocar):
	//   - La nube está en WGS84 / UTM zona 14N (EPSG:32614), en metros.
	//   - El eje Z de la nube es la misma altura que trae el LAS original,
	//     así que usamos la altitud EXIF/XMP de la foto tal cual, sin offsets.
	//   - La foto se dibuja como un plano orientado según yaw/pitch/roll del
	//     gimbal (o de vuelo si el gimbal no está disponible), a la distancia
	//     donde el rayo central de la cámara cruza el plano del terreno estimado
	//     (altitud absoluta menos altitud relativa). No es una ortorectificación
	//     real sobre relieve irregular, es una aproximación de plano rígido.
	// =========================================================================

	const PROJ4_UTM14N = "+proj=utm +zone=14 +datum=WGS84 +units=m +no_defs";
	const PROJ4_ECEF   = "+proj=geocent +datum=WGS84 +units=m +no_defs";

	// =========================================================================
	// Cámaras ajustadas (bundle adjustment de Agisoft Metashape).
	//
	// El EXIF crudo del dron es solo el punto de partida que usó Metashape;
	// durante el alineamiento esas posiciones/orientaciones se refinan.
	// El XML exportado ("Export Cameras") trae, por cámara, la pose YA
	// AJUSTADA como una matriz 4x4 en el sistema de coordenadas interno del
	// chunk, más una transformación de chunk -> mundo (rotación + traslación
	// + escala) cuyo resultado es ECEF (geocéntrico WGS84, en metros: por
	// eso la traslación son números de ~6 dígitos, del orden del radio
	// terrestre).
	//
	// Para usar esa pose en nuestra escena (que vive en UTM 14N + altura):
	//   1) posición/ejes de la cámara en coords locales del chunk
	//      (columna de traslación / columnas de rotación de <camera><transform>)
	//   2) aplicar la transform de chunk (rotación*escala + traslación) -> ECEF
	//   3) ECEF -> lon/lat/altura (geográficas WGS84) con proj4
	//   4) lon/lat -> UTM 14N (igual que con las fotos sueltas); la altura
	//      queda directamente como Z, sin tocar (mismo criterio que usamos
	//      en todo lo demás)
	//   5) los EJES de la cámara (right/up/forward) se llevan de ECEF a un
	//      sistema local Este-Norte-Arriba (ENU) en el punto de la cámara;
	//      ENU y nuestro mundo UTM/altura son esencialmente el mismo marco
	//      a esta escala (decenas de metros), así que right/up/forward en
	//      ENU son directamente utilizables como right/up/forward del plano.
	// =========================================================================

	let cameraDB = null; // { hFOVdeg, vFOVdeg, Rc[9], Tc[3], scale, camerasByLabel: Map }

	function parseCamerasXML(xmlText){
		const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
		if (doc.querySelector('parsererror')) throw new Error('El XML no se pudo interpretar (¿es el export de cámaras de Metashape?).');

		const sensorEl = doc.querySelector('sensors > sensor');
		if (!sensorEl) throw new Error('No encontré <sensor> en el XML.');
		const calibEl = sensorEl.querySelector('calibration');
		if (!calibEl) throw new Error('El sensor no trae <calibration> (¿el chunk está alineado?).');
		const resEl = calibEl.querySelector('resolution');
		const fPix  = parseFloat(calibEl.querySelector('f').textContent);
		const wPix  = parseFloat(resEl.getAttribute('width'));
		const hPix  = parseFloat(resEl.getAttribute('height'));
		const hFOVdeg = 2 * Math.atan(wPix / (2 * fPix)) * 180 / Math.PI;
		const vFOVdeg = 2 * Math.atan(hPix / (2 * fPix)) * 180 / Math.PI;

		const chunkTransformEl = doc.querySelector('chunk > transform');
		if (!chunkTransformEl) throw new Error('No encontré la transform del chunk (chunk > transform).');
		const Rc = chunkTransformEl.querySelector('rotation').textContent.trim().split(/\s+/).map(Number);
		const Tc = chunkTransformEl.querySelector('translation').textContent.trim().split(/\s+/).map(Number);
		const scale = parseFloat(chunkTransformEl.querySelector('scale').textContent);

		const camerasByLabel = new Map();
		let alignedCount = 0;
		doc.querySelectorAll('cameras > camera').forEach(camEl => {
			const label = camEl.getAttribute('label');
			const transformEl = camEl.querySelector('transform');
			const entry = { label, aligned: !!transformEl };
			if (transformEl){
				entry.localMatrix = transformEl.textContent.trim().split(/\s+/).map(Number);
				alignedCount++;
			}
			camerasByLabel.set(label, entry);
		});

		return { hFOVdeg, vFOVdeg, Rc, Tc, scale, camerasByLabel, alignedCount, total: camerasByLabel.size };
	}

	function mat3VecMul(R, v){
		return [
			R[0]*v[0] + R[1]*v[1] + R[2]*v[2],
			R[3]*v[0] + R[4]*v[1] + R[5]*v[2],
			R[6]*v[0] + R[7]*v[1] + R[8]*v[2]
		];
	}
	function vNormalize(v){
		const len = Math.hypot(v[0], v[1], v[2]) || 1;
		return [v[0]/len, v[1]/len, v[2]/len];
	}
	function vDot(a,b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }

	// Pose ajustada (posición + ejes right/up/forward) de una cámara alineada,
	// ya llevada a UTM 14N + ENU local.
	function computeAdjustedPose(entry){
		const M = entry.localMatrix; // 4x4 fila por fila: m00 m01 m02 m03 m10 m11 ... m33
		const camPosLocal = [M[3], M[7], M[11]];
		// columnas de la parte de rotación = ejes de la cámara en coords locales del chunk
		// (convención Agisoft: X=derecha, Y=arriba, Z=hacia atrás de la vista)
		const rightLocal = [M[0], M[4], M[8]];
		const upLocal     = [M[1], M[5], M[9]];
		const backLocal   = [M[2], M[6], M[10]];

		const Rc = cameraDB.Rc, Tc = cameraDB.Tc, s = cameraDB.scale;

		const posEcef = mat3VecMul(Rc, camPosLocal).map((v,i) => v*s + Tc[i]);
		const rightEcef = mat3VecMul(Rc, rightLocal);
		const upEcef    = mat3VecMul(Rc, upLocal);
		const forwardEcef = mat3VecMul(Rc, backLocal).map(v => -v);

		const [lon, lat, h] = proj4(PROJ4_ECEF, 'EPSG:4326', posEcef);

		const lonRad = lon*Math.PI/180, latRad = lat*Math.PI/180;
		const sinLon = Math.sin(lonRad), cosLon = Math.cos(lonRad);
		const sinLat = Math.sin(latRad), cosLat = Math.cos(latRad);
		const East  = [-sinLon, cosLon, 0];
		const North = [-sinLat*cosLon, -sinLat*sinLon, cosLat];
		const Up    = [cosLat*cosLon, cosLat*sinLon, sinLat];
		const toENU = (v) => vNormalize([vDot(v,East), vDot(v,North), vDot(v,Up)]); // x=Este, y=Norte, z=Arriba

		const rightENU   = toENU(rightEcef);
		const upENU      = toENU(upEcef);
		const forwardENU = toENU(forwardEcef);

		const utm = proj4('EPSG:4326', PROJ4_UTM14N, [lon, lat]);
		const camPos = new THREE.Vector3(utm[0], utm[1], h);

		return {
			camPos,
			right:   new THREE.Vector3(rightENU[0],   rightENU[1],   rightENU[2]),
			up:      new THREE.Vector3(upENU[0],      upENU[1],      upENU[2]),
			forward: new THREE.Vector3(forwardENU[0], forwardENU[1], forwardENU[2])
		};
	}

	// A partir de yaw/pitch/roll "de vuelo" (grados), construye la misma
	// terna right/up/forward que usa computeAdjustedPose — es el método
	// de respaldo cuando no hay XML o la foto no está en él.
	function basisFromYPR(yawDeg, pitchDeg, rollDeg){
		const yawRad = yawDeg * Math.PI/180;
		const pitchRad = pitchDeg * Math.PI/180;
		const rollRad = rollDeg * Math.PI/180;

		const forward = new THREE.Vector3(
			Math.cos(pitchRad) * Math.sin(yawRad),
			Math.cos(pitchRad) * Math.cos(yawRad),
			Math.sin(pitchRad)
		).normalize();

		const worldUp = new THREE.Vector3(0,0,1);
		let right = new THREE.Vector3().crossVectors(forward, worldUp);
		if (right.lengthSq() < 1e-6) right.set(1,0,0); else right.normalize();
		let up = new THREE.Vector3().crossVectors(right, forward).normalize();

		const rollQuat = new THREE.Quaternion().setFromAxisAngle(forward, rollRad);
		right.applyQuaternion(rollQuat);
		up.applyQuaternion(rollQuat);

		return { right, up, forward };
	}

	// Angulo de roll equivalente de una terna right/up/forward, relativo a
	// la orientación "sin roll" (horizonte nivelado) para ese mismo forward.
	// Se usa solo para la compensación visual de roll en la vista primera
	// persona (ver evento 'update' más abajo).
	function rollAngleFromBasis(forward, up){
		const worldUp = new THREE.Vector3(0,0,1);
		let right0 = new THREE.Vector3().crossVectors(forward, worldUp);
		if (right0.lengthSq() < 1e-6) return 0;
		right0.normalize();
		const up0 = new THREE.Vector3().crossVectors(right0, forward).normalize();
		const cross = new THREE.Vector3().crossVectors(up0, up);
		return Math.atan2(cross.dot(forward), up0.dot(up));
	}

	const dropzone   = document.getElementById('dropzone');
	const fileInput  = document.getElementById('fileInput');
	const xmlDropzone = document.getElementById('xmlDropzone');
	const xmlFileInput = document.getElementById('xmlFileInput');
	const xmlStatus  = document.getElementById('xmlStatus');
	const readout    = document.getElementById('readout');
	const opacityRow = document.getElementById('opacityRow');
	const opacitySlider = document.getElementById('opacitySlider');
	const removeBtn  = document.getElementById('removeBtn');
	const photoError = document.getElementById('photoError');
	const panelHead  = document.getElementById('photoPanelHead');
	const panel      = document.getElementById('photoPanel');
	const collapseIcon = document.getElementById('collapseIcon');
	const viewBtnsRow = document.getElementById('viewBtnsRow');
	const flyBtn     = document.getElementById('flyBtn');
	const restoreBtn = document.getElementById('restoreBtn');

	const DEFAULT_FOV = 60;
	let savedView = null;      // vista general antes de "entrar" a la cámara del dron
	let lastShot  = null;      // {camPos, target, vfovDeg} de la última foto colocada

	panelHead.addEventListener('click', () => {
		panel.classList.toggle('collapsed');
		collapseIcon.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
	});

	let currentPlaneMesh = null;
	let currentTexture = null;

	function getThreeScene(){
		if (viewer.scene && viewer.scene.scene) return viewer.scene.scene;
		console.warn("No se encontró viewer.scene.scene; no se puede agregar la foto a la escena.");
		return null;
	}

	['dragenter','dragover'].forEach(evt => {
		dropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('drag'); });
	});
	['dragleave','drop'].forEach(evt => {
		dropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('drag'); });
	});
	dropzone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handlePhoto(f); });
	dropzone.addEventListener('click', () => fileInput.click());
	fileInput.addEventListener('change', () => { if (fileInput.files[0]) handlePhoto(fileInput.files[0]); });

	['dragenter','dragover'].forEach(evt => {
		xmlDropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); xmlDropzone.classList.add('drag'); });
	});
	['dragleave','drop'].forEach(evt => {
		xmlDropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); xmlDropzone.classList.remove('drag'); });
	});
	xmlDropzone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleCamerasXML(f); });
	xmlDropzone.addEventListener('click', () => xmlFileInput.click());
	xmlFileInput.addEventListener('change', () => { if (xmlFileInput.files[0]) handleCamerasXML(xmlFileInput.files[0]); });

	async function handleCamerasXML(file){
		xmlStatus.style.display = 'block';
		xmlStatus.style.color = '';
		xmlStatus.textContent = 'Leyendo XML…';
		try{
			const text = await file.text();
			cameraDB = parseCamerasXML(text);
			xmlDropzone.classList.add('loaded');
			xmlDropzone.textContent = 'Cámaras cargadas ✓ (' + file.name + ')';
			xmlStatus.textContent = `${cameraDB.alignedCount}/${cameraDB.total} cámaras alineadas · FOV calibrado ${cameraDB.hFOVdeg.toFixed(1)}°`;
		} catch(err){
			console.error(err);
			cameraDB = null;
			xmlDropzone.classList.remove('loaded');
			xmlStatus.style.color = 'var(--danger)';
			xmlStatus.textContent = 'Error: ' + err.message;
		}
	}

	function showError(msg){ photoError.style.display = 'block'; photoError.textContent = msg; }
	function clearError(){ photoError.style.display = 'none'; photoError.textContent = ''; }

	function pick(tags, candidates){
		const keys = Object.keys(tags);
		for (const cand of candidates){
			const found = keys.find(k => k.toLowerCase() === cand.toLowerCase());
			if (found !== undefined && tags[found] !== undefined && tags[found] !== null && tags[found] !== '') return tags[found];
		}
		return undefined;
	}

	function row(label, value, warn){
		const div = document.createElement('div');
		div.className = 'row' + (warn ? ' warn' : '');
		div.innerHTML = `<span>${label}</span><span>${value}</span>`;
		return div;
	}

	async function handlePhoto(file){
		clearError();
		readout.style.display = 'none';
		readout.innerHTML = '';
		opacityRow.style.display = 'none';
		removeBtn.style.display = 'none';

		if (!window.exifr){
			showError('No cargó la librería de lectura EXIF (revisá conexión a internet).');
			return;
		}
		if (!/jpe?g$/i.test(file.name) && file.type !== 'image/jpeg'){
			showError('Necesito un JPG: es donde los drones graban los metadatos XMP de vuelo/gimbal.');
			return;
		}

		try {
			// 1) leer imagen (para textura + dimensiones reales)
			const objectUrl = URL.createObjectURL(file);
			const img = await loadImage(objectUrl);

			// 2) leer metadatos
			const buffer = await file.arrayBuffer();
			const tags = await exifr.parse(buffer, {
				tiff:true, exif:true, gps:true, xmp:true, iptc:true,
				mergeOutput:true, translateKeys:true, translateValues:true, reviveValues:true
			});
			if (!tags) { showError('La imagen no trae metadatos EXIF/XMP.'); return; }

			const lat = pick(tags, ['latitude','GPSLatitude']);
			const lon = pick(tags, ['longitude','GPSLongitude']);
			if (typeof lat !== 'number' || typeof lon !== 'number'){
				showError('La foto no trae coordenadas GPS; no puedo ubicarla en la nube.');
				return;
			}

			const absAlt = pick(tags, ['AbsoluteAltitude']);
			const gpsAlt = pick(tags, ['GPSAltitude']);
			const relAlt = pick(tags, ['RelativeAltitude']);
			const altExif = (typeof absAlt === 'number') ? absAlt : (typeof gpsAlt === 'number' ? gpsAlt : undefined);
			if (typeof altExif !== 'number'){
				showError('La foto no trae altitud; no puedo ubicarla en Z.');
				return;
			}

			let yaw   = pick(tags, ['GimbalYawDegree','FlightYawDegree']);
			let pitch = pick(tags, ['GimbalPitchDegree','FlightPitchDegree']);
			let roll  = pick(tags, ['GimbalRollDegree','FlightRollDegree']);
			const gimbalSource = pick(tags, ['GimbalYawDegree']) !== undefined ? 'gimbal' : 'vuelo';
			if (typeof yaw !== 'number')   yaw = 0;
			if (typeof pitch !== 'number') pitch = -90; // asumimos nadir si no hay dato
			if (typeof roll !== 'number')  roll = 0;

			let fovDegExif = pick(tags, ['FOV']);
			const focal35 = pick(tags, ['FocalLengthIn35mmFormat']);
			if (typeof fovDegExif !== 'number'){
				if (typeof focal35 === 'number' && focal35 > 0){
					fovDegExif = 2 * Math.atan(36 / (2 * focal35)) * (180/Math.PI);
				} else {
					fovDegExif = 84; // fallback típico de gran angular en drones si no hay dato
				}
			}

			const imgAspect = img.naturalHeight / img.naturalWidth;

			// -----------------------------------------------------------
			// Elegir fuente de la pose: XML de Metashape (ajustado, exacto)
			// si la foto matchea por nombre de archivo, si no EXIF crudo.
			// -----------------------------------------------------------
			const baseName = file.name.replace(/\.[^.]+$/, '');
			let pose, hFOVdeg, vFOVdeg, poseSource, xmlNote = '';

			if (cameraDB && cameraDB.camerasByLabel.has(baseName)){
				const entry = cameraDB.camerasByLabel.get(baseName);
				if (entry.aligned){
					pose = computeAdjustedPose(entry);
					hFOVdeg = cameraDB.hFOVdeg;
					vFOVdeg = cameraDB.vFOVdeg;
					poseSource = 'xml';
				} else {
					xmlNote = ' (esta foto no se alineó en Metashape, usando EXIF)';
				}
			}

			if (!pose){
				pose = basisFromYPR(yaw, pitch, roll);
				const utm = proj4('EPSG:4326', PROJ4_UTM14N, [lon, lat]);
				pose.camPos = new THREE.Vector3(utm[0], utm[1], altExif);
				hFOVdeg = fovDegExif;
				vFOVdeg = 2 * Math.atan(Math.tan(hFOVdeg*Math.PI/180/2) * imgAspect) * 180/Math.PI;
				poseSource = 'exif';
			}

			// distancia estimada al terreno: usamos altitud relativa (EXIF)
			// si está, si no un valor por defecto razonable para un plano nadir
			let distance;
			if (typeof relAlt === 'number' && relAlt > 0 && Math.abs(pose.forward.z) > 0.1){
				distance = Math.abs(relAlt / pose.forward.z);
			} else {
				distance = 50;
			}

			// textura
			if (currentTexture) currentTexture.dispose();
			currentTexture = new THREE.Texture(img);
			currentTexture.needsUpdate = true;

			placePlane({ pose, hFOVdeg, vFOVdeg, imgAspect, distance });

			// readout informativo
			readout.style.display = 'block';
			readout.appendChild(row('Fuente de la pose', poseSource === 'xml' ? 'XML Metashape (ajustada)' : ('EXIF' + xmlNote)));
			readout.appendChild(row('Posición cámara', `${pose.camPos.x.toFixed(2)}, ${pose.camPos.y.toFixed(2)}, ${pose.camPos.z.toFixed(2)}`));
			readout.appendChild(row('Lat / Lon (EXIF)', `${lat.toFixed(5)}, ${lon.toFixed(5)}`));
			if (poseSource === 'exif'){
				readout.appendChild(row('Yaw / Pitch / Roll', `${yaw.toFixed(1)}° / ${pitch.toFixed(1)}° / ${roll.toFixed(1)}°`, gimbalSource !== 'gimbal'));
				if (gimbalSource !== 'gimbal') readout.lastChild.querySelector('span:first-child').textContent = 'Yaw/Pitch/Roll (vuelo, sin gimbal)';
			}
			readout.appendChild(row('FOV horiz. / vert.', `${hFOVdeg.toFixed(1)}° / ${vFOVdeg.toFixed(1)}°` + (poseSource === 'xml' ? ' (calibrado)' : ' (estimado)')));
			readout.appendChild(row('Distancia proyectada', `${distance.toFixed(1)} m` + (typeof relAlt !== 'number' ? ' (por defecto)' : '')));

			opacityRow.style.display = 'block';
			removeBtn.style.display = 'block';

		} catch(err){
			console.error(err);
			showError('Error al procesar la foto: ' + err.message);
		}
	}

	function loadImage(src){
		return new Promise((resolve, reject) => {
			const img = new Image();
			img.onload = () => resolve(img);
			img.onerror = reject;
			img.src = src;
		});
	}

	function flyToCameraView(camPos, target, vfovDeg, rollRad){
		if (!viewer.scene || !viewer.scene.view || typeof viewer.scene.view.lookAt !== 'function'){
			console.warn('No se encontró viewer.scene.view; no puedo mover la cámara.');
			return false;
		}
		const view = viewer.scene.view;

		// guardamos la vista general solo una vez (la primera vez que "entramos")
		if (!savedView){
			savedView = {
				position: view.position.clone(),
				yaw: view.yaw,
				pitch: view.pitch,
				radius: view.radius,
				fov: DEFAULT_FOV
			};
		}

		view.position.set(camPos.x, camPos.y, camPos.z);
		view.lookAt(new THREE.Vector3(target.x, target.y, target.z));
		if ('radius' in view) view.radius = camPos.distanceTo(target);

		viewer.setFOV(vfovDeg);

		// Potree (yaw/pitch) no sabe de roll; lo aplicamos aparte cada frame
		// directamente sobre la cámara Three.js (ver evento 'update' arriba).
		cameraRollRad = (typeof rollRad === 'number') ? rollRad : 0;
		rollTarget = cameraRollRad ? new THREE.Vector3(target.x, target.y, target.z) : null;

		return true;
	}

	function restoreGeneralView(){
		if (!savedView || !viewer.scene || !viewer.scene.view) return;
		const view = viewer.scene.view;
		view.position.copy(savedView.position);
		if (typeof savedView.yaw === 'number') view.yaw = savedView.yaw;
		if (typeof savedView.pitch === 'number') view.pitch = savedView.pitch;
		if (typeof savedView.radius === 'number') view.radius = savedView.radius;
		viewer.setFOV(savedView.fov);
		cameraRollRad = 0;
		rollTarget = null;
		savedView = null;
	}

	flyBtn.addEventListener('click', () => {
		if (lastShot) flyToCameraView(lastShot.camPos, lastShot.target, lastShot.vfovDeg, lastShot.rollRad);
	});
	restoreBtn.addEventListener('click', () => restoreGeneralView());

	function placePlane({pose, hFOVdeg, vFOVdeg, distance}){
		const scene = getThreeScene();
		if (!scene){ showError('No se pudo acceder a la escena 3D de Potree.'); return; }

		const { camPos, right, up, forward } = pose;
		const center = camPos.clone().add(forward.clone().multiplyScalar(distance));

		const hfovRad = hFOVdeg * Math.PI/180;
		const vfovRad = vFOVdeg * Math.PI/180;
		const width  = 2 * distance * Math.tan(hfovRad/2);
		const height = 2 * distance * Math.tan(vfovRad/2);

		if (currentPlaneMesh){
			scene.remove(currentPlaneMesh);
			currentPlaneMesh.geometry.dispose();
			currentPlaneMesh.material.dispose();
			currentPlaneMesh = null;
		}

		const PlaneGeo = THREE.PlaneBufferGeometry || THREE.PlaneGeometry;
		const geometry = new PlaneGeo(width, height);
		const material = new THREE.MeshBasicMaterial({
			map: currentTexture,
			transparent: true,
			opacity: parseFloat(opacitySlider.value),
			side: THREE.DoubleSide,
			depthWrite: false,
			depthTest: false
		});
		const mesh = new THREE.Mesh(geometry, material);

		const normal = forward.clone().negate();
		const basis = new THREE.Matrix4().makeBasis(right, up, normal);
		mesh.quaternion.setFromRotationMatrix(basis);
		mesh.position.copy(center);
		mesh.renderOrder = 999999; // se dibuja siempre después (encima) de la nube de puntos

		scene.add(mesh);
		currentPlaneMesh = mesh;

		// El EDL (eye dome lighting) de Potree se compone en un post-proceso
		// que se dibuja DESPUÉS del resto de la escena, así que taparía la foto
		// aunque el material tenga depthTest:false. Lo apagamos mientras se
		// muestra la foto y lo restauramos al quitarla.
		viewer.setEDLEnabled(false);

		const vfovDeg = vfovRad * 180/Math.PI;
		const rollRad = rollAngleFromBasis(forward, up);
		lastShot = { camPos: camPos.clone(), target: center.clone(), vfovDeg, rollRad };
		flyToCameraView(camPos, center, vfovDeg, rollRad);
		viewBtnsRow.style.display = 'flex';
	}

	opacitySlider.addEventListener('input', () => {
		if (currentPlaneMesh) currentPlaneMesh.material.opacity = parseFloat(opacitySlider.value);
	});

	removeBtn.addEventListener('click', () => {
		const scene = getThreeScene();
		if (currentPlaneMesh && scene){
			scene.remove(currentPlaneMesh);
			currentPlaneMesh.geometry.dispose();
			currentPlaneMesh.material.dispose();
			currentPlaneMesh = null;
		}
		viewer.setEDLEnabled(true);
		readout.style.display = 'none';
		readout.innerHTML = '';
		opacityRow.style.display = 'none';
		removeBtn.style.display = 'none';
		viewBtnsRow.style.display = 'none';
		fileInput.value = '';
		lastShot = null;
		restoreGeneralView();
	});

</script>
