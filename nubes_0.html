<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Potree Viewer</title>

<link rel="stylesheet" href="js/potree/build/potree/potree.css">
<link rel="stylesheet" href="js/potree/libs/jquery-ui/jquery-ui.min.css">
<link rel="stylesheet" href="js/potree/libs/openlayers3/ol.css">
<link rel="stylesheet" href="js/potree/libs/spectrum/spectrum.css">
<link rel="stylesheet" href="js/potree/libs/jstree/themes/mixed/style.css">

<script src="js/potree/libs/jquery/jquery-3.1.1.min.js"></script>
<script src="js/potree/libs/spectrum/spectrum.js"></script>
<script src="js/potree/libs/jquery-ui/jquery-ui.min.js"></script>
<script src="js/potree/libs/other/BinaryHeap.js"></script>
<script src="js/potree/libs/tween/tween.min.js"></script>
<script src="js/potree/libs/d3/d3.js"></script>
<script src="js/potree/libs/proj4/proj4.js"></script>
<script src="js/potree/libs/openlayers3/ol.js"></script>
<script src="js/potree/libs/i18next/i18next.js"></script>
<script src="js/potree/libs/jstree/jstree.js"></script>
<script src="js/potree/libs/three.js/build/three.min.js"></script>
<script src="js/potree/libs/plasio/js/laslaz.js"></script>
<script src="js/potree/build/potree/potree.js"></script>

<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}

	#potree_render_area {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
	}
</style>

</head>
<body>

<div id="potree_render_area"></div>

<script>
	window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

	// Forzamos OrbitControls: EarthControls (el default) bloquea el giro
	// horizontal en nubes pequeñas / no georreferenciadas.
	viewer.setControls(viewer.orbitControls);

	viewer.setEDLEnabled(true);
	viewer.setFOV(60);
	viewer.setPointBudget(2_000_000);
	viewer.setBackground("gradient");

	Potree.loadPointCloud("js/potree/nubes/15m_utm14n_converted/metadata.json", "15m", function (e) {
		viewer.scene.addPointCloud(e.pointcloud);

		let material = e.pointcloud.material;
		material.size = 1;
		material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

		viewer.fitToScreen();
	});
</script>

</body>
</html>
