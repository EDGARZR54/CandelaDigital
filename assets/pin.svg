<!--
    Pin de los mapas del sitio (galeria-mapa.js, atlas.html,
    mapadinamico.html). Forma de gota con un "hole" blanco al centro.

    El color del path con id="pin-fill" se pisa en runtime por código,
    leyendo la variable rojo-terracota de variables.css — el valor que
    ves acá abajo es solo el de VISTA PREVIA al abrir este archivo
    directo en un navegador o editor. Cambiar el fill de acá no cambia
    el color del pin en el sitio; para eso hay que tocar variables.css.

    Lo que SÍ se edita acá: la forma (el "d" del path), el grosor/color
    del trazo blanco, el radio del círculo del centro, o el viewBox.

    OJO al editar este comentario: un comentario SVG no admite dos
    guiones consecutivos en ningún lado de su cuerpo (ni siquiera para
    escribir el prefijo con el que empiezan las variables CSS, o la
    propia secuencia de cierre del comentario) — cualquiera de esas
    combinaciones corta el comentario a la mitad o invalida el
    archivo entero.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path id="pin-fill" fill="#BF3B0B" stroke="#ffffff" stroke-width="0.6"
    d="M12 1.5C7.86 1.5 4.5 4.86 4.5 9c0 5.63 7.5 13.5 7.5 13.5S19.5 14.63 19.5 9c0-4.14-3.36-7.5-7.5-7.5z"/>
  <circle cx="12" cy="9" r="2.6" fill="#ffffff"/>
</svg>
